  # ---------- free-coding ----------
  - model_name: free-coding
    litellm_params:
      model: openai/laguna-s-2.1-free
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/OPENCODE_FREE_API_KEY   # dummy; Free tier rejects real keys
      timeout: 180
