    litellm_params:
      model: openai/nemotron-3.5-lightning-free
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/OPENCODE_FREE_API_KEY   # dummy; Free tier rejects real keys
      timeout: 60
      num_retries: 1
  - model_name: free-fast
    litellm_params:
      model: openai/stepfun/step-3.7-flash
      api_base: https://inference-api.nousresearch.com/v1
