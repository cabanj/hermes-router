model_list:
  # ---------- free-general (Nous Portal / OpenCode prioritized over OpenRouter) ----------
  - model_name: free-general
    litellm_params:
      model: openai/meituan/longcat-2.0:free
      api_base: https://inference-api.nousresearch.com/v1
      api_key: os.environ/NOUS_PORTAL_API_KEY
      timeout: 90
      num_retries: 1
      tags: ["general", "nous"]
  - model_name: free-general
    litellm_params:
      model: openai/upstage/solar-pro4:free
      api_base: https://inference-api.nousresearch.com/v1
      api_key: os.environ/NOUS_PORTAL_API_KEY
      timeout: 90
      num_retries: 1
      tags: ["general", "nous"]
  - model_name: free-general
    litellm_params:
      model: openai/minimax/minimax-m3:free
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 90
      num_retries: 1
      tags: ["general", "openrouter"]
  - model_name: free-general
    litellm_params:
