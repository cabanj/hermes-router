  - model_name: free-fallback
    litellm_params:
      model: openai/minimax/minimax-m3:free
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 90
      num_retries: 1
      tags: ["fallback", "openrouter"]
  - model_name: free-fallback
    litellm_params:
      model: openai/nvidia/nemotron-3-ultra-550b-a55b:free
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY
