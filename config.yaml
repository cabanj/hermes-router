  # ---------- free-fallback ----------
  - model_name: free-fallback
    litellm_params:
      model: openai/hy3-free
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/OPENCODE_FREE_API_KEY
      timeout: 120
      num_retries: 1
  - model_name: free-fallback
    litellm_params:
      model: openai/big-pickle
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/OPENCODE_FREE_API_KEY
