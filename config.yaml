      timeout: 90
      num_retries: 1
      tags: ["fallback", "openrouter"]

litellm_settings:
  drop_params: true
  request_timeout: 120
  num_retries: 1
  retry_policy:
    "429": [429]
    "500": [500, 502, 503, 504]

general_settings:
  health_check_interval: 60

logging: verbose
