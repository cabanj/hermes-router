  - model_name: free-fallback
    litellm_params:
      model: openai/tencent/hy3:free
      api_base: https://inference-api.nousresearch.com/v1
      api_key: os.environ/NOUS_PORTAL_API_KEY
      timeout: 120
      num_retries: 1

litellm_settings:
  # Fallback chain per alias (order = priority)
  fallbacks:
    - free-fast: ["free-fast", "free-fast", "free-fast"]   # same-name entries = next deployment in list order
    - free-general: ["free-general", "free-general", "free-general"]
    - free-coding: ["free-coding", "free-coding"]
    - free-fallback: ["free-fallback", "free-fallback"]
  respect_retry_after_header: true
  drop_params: true
  request_timeout: 180

general_settings:
  master_key: os.environ/ROUTER_API_KEY

router_settings:
  routing_strategy: simple-shuffle   # first healthy deployment wins; retries move down the list
  num_retries: 2
  retry_policy:
    "429": [429]
    "500": [500, 502, 503, 504]

# Whitelist enforcement: only models declared above are routable.
# Unknown model names -> 400 by LiteLLM default (no auto-routing to other models).

logging: verbose
