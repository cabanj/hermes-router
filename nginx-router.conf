server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 135-125-233-237.sslip.io;

    ssl_certificate /etc/letsencrypt/live/135-125-233-237.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/135-125-233-237.sslip.io/privkey.pem;

    # Rate limit: 10 r/m per IP (zone must be defined at http level in conf.d)

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # streaming support
        proxy_buffering off;
    }
}
