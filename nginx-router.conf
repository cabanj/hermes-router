server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name <YOUR_HOST>.sslip.io;

    ssl_certificate /etc/letsencrypt/live/<YOUR_HOST>.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<YOUR_HOST>.sslip.io/privkey.pem;

    # Rate limit: 10 r/m per IP (zone must be defined at http level in conf.d)

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # streaming support
        proxy_buffering off;
    }

    # Serve the model-wiki (changelog etc.) on the public :443 endpoint too
    location /wiki/ {
        alias /var/www/model-wiki/;
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control 'no-cache, no-store, must-revalidate';
        add_header X-Content-Type-Options 'nosniff';
    }
}